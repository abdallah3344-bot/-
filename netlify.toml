# ============================================================
# إعدادات النشر على Netlify — نظام إدارة مكتب المحاماة
# ============================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# محرك Next.js على Netlify: يشغّل مكونات الخادم و Server Actions
# و proxy.ts داخل دوال Netlify بدل بناء الموقع كملفات ساكنة.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # نظام داخلي للمكتب — لا يُفهرس في محركات البحث إطلاقًا
    X-Robots-Tag = "noindex, nofollow"
