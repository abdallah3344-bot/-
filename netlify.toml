# ============================================================
# إعدادات النشر على Netlify — نظام إدارة مكتب المحاماة
# ============================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# محرك Next.js على Netlify: يشغّل مكونات الخادم و Server Actions
# و proxy.ts داخل دوال Netlify بدل بناء الموقع كملفات ساكنة.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# رؤوس الأمان مضبوطة في next.config.ts لأن الصفحات تُقدَّم من دالة الخادم
# ولا تمرّ على قواعد رؤوس Netlify.
